<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sales Ledger</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <header class="top">
    <span class="brand">Sales Ledger</span>
    <span class="source">Live from ETL_Sales</span>
  </header>

  <main>
    <section class="hero">
      <div class="ribbon" aria-hidden="true">
        <i class="c0"></i><i class="c1"></i><i class="c2"></i><i class="c3"></i><i class="c4"></i>
      </div>
      <h1>Every order,<br>on one page.</h1>
      <p class="lede">Live data from the ETL_Sales database, loaded each time the page opens.</p>
    </section>

    <section class="panel">
      <h2>Orders</h2>
      <div class="scroll">
        {{ table | safe }}
      </div>
    </section>
  </main>

  <footer>Sales Ledger &middot; Flask + SQL Server</footer>
</body>
</html>
